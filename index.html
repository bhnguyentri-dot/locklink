<style>
    #nt-login-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7); z-index: 9999;
        display: flex; justify-content: center; align-items: center;
        backdrop-filter: blur(5px);
    }
    #nt-login-box {
        background: white; padding: 25px; border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5); width: 320px; text-align: center;
        font-family: Arial, sans-serif;
    }
    #nt-login-box h3 { margin-top: 0; color: #333; }
    #nt-login-box input {
        width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box;
        border: 1px solid #ccc; border-radius: 5px; font-size: 16px;
    }
    #nt-login-box .btn-group { display: flex; justify-content: space-between; }
    #nt-login-box button {
        padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
    }
    #nt-btn-ok { background: #007bff; color: white; flex: 1; margin-right: 5px; }
    #nt-btn-cancel { background: #dc3545; color: white; flex: 1; margin-left: 5px; }
    #nt-message { color: red; font-size: 13px; margin-top: 10px; min-height: 18px; font-weight: bold; }
</style>

<div id="nt-login-overlay">
    <div id="nt-login-box">
        <h3>Yêu cầu truy cập</h3>
        <p style="font-size: 14px; color: #666;">Vui lòng nhập mật khẩu để tiếp tục</p>
        <input type="password" id="nt-password-input" placeholder="Nhập mật khẩu..." autofocus>
        <div class="btn-group">
            <button id="nt-btn-ok" onclick="checkPassword()">XÁC NHẬN</button>
            <button id="nt-btn-cancel" onclick="handleCancel()">HỦY BỎ</button>
        </div>
        <div id="nt-message"></div>
    </div>
</div>

<script>
    const password = "686868";
    const targetURL = atob("aHR0cHM6Ly9iaG5ndXllbnRyaS1kb3QuZ2l0aHViLmlvL2Joc2x0");
    const failURL = "https://bhs.edu.vn/";
    const maxMistakes = 5;
    const timeLimit = 10000;

    let mistakes = 0;
    let timer;
    let isRedirecting = false;

    window.onload = function() {
        const inputField = document.getElementById("nt-password-input");
        inputField.focus();
        
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") { checkPassword(); }
        });

        timer = setTimeout(function() {
            if (!isRedirecting) {
                showErrorAndRedirect("Hết giờ (10s)! Đang chuyển hướng...");
            }
        }, timeLimit);
    };

    function checkPassword() {
        if (isRedirecting) return;
        clearTimeout(timer);

        const input = document.getElementById("nt-password-input").value;
        const msg = document.getElementById("nt-message");

        if (input === password) {
            isRedirecting = true;
            msg.style.color = "green";
            msg.innerText = "Mật khẩu đúng! Đang vào...";
            window.location.href = targetURL;
        } else {
            mistakes++;
            if (mistakes >= maxMistakes) {
                showErrorAndRedirect("Sai quá 5 lần! Đang chuyển hướng...");
            } else {
                msg.style.color = "red";
                msg.innerText = `Sai! Còn ${maxMistakes - mistakes} lần thử.`;
                document.getElementById("nt-password-input").value = "";
                document.getElementById("nt-password-input").focus();
                
                timer = setTimeout(function() {
                    if (!isRedirecting) showErrorAndRedirect("Thao tác chậm! Đang chuyển hướng...");
                }, timeLimit);
            }
        }
    }

    function handleCancel() {
        window.location.href = failURL;
    }

    function showErrorAndRedirect(text) {
        isRedirecting = true;
        const msg = document.getElementById("nt-message");
        msg.style.color = "red";
        msg.innerText = text;
        
        document.getElementById("nt-password-input").disabled = true;
        document.getElementById("nt-btn-ok").disabled = true;
        document.getElementById("nt-btn-cancel").disabled = true;

        setTimeout(function() {
            window.location.href = failURL;
        }, 1500);
    }
</script>

<h1>Vui lòng nhập mật khẩu ở bảng hiện ra...</h1>
